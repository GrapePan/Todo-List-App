<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <header><h1 style="font-weight:900;">Todo List App</h1></header>
    <div class="todo-menu">
        <button id="add-todo" title="Add Todo">
            <span class="material-symbols-rounded">add_task</span>
        </button>
    </div>
    <div class="todo-list">
        <p>click the <span class="material-symbols-rounded">add_task</span> to add a new todo!</p>
    </div>
    <footer>
        <p>Created by <a href="https://github.com/GrapePan" target="_blank">GrapePan (ぶどうフライパン)</a></p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
